# Despliegue en el VPS: docker compose up -d --build
services:
  horizonte:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - datos:/app/datos
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMINIO: ${DOMINIO:?Define DOMINIO en el archivo .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_datos:/data
      - caddy_config:/config
    depends_on:
      - horizonte

volumes:
  datos:
  caddy_datos:
  caddy_config:
