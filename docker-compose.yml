# HORIZONTE en el VPS, detrás del Traefik que ya corre ahí.
# Despliegue: docker compose up -d --build
services:
  horizonte:
    build: .
    container_name: horizonte
    restart: unless-stopped
    env_file: .env
    volumes:
      - horizonte_datos:/app/datos
    networks:
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-traefik}
      - traefik.http.routers.horizonte.rule=Host(`${DOMINIO:?Define DOMINIO en .env}`)
      - traefik.http.routers.horizonte.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.horizonte.tls=true
      - traefik.http.routers.horizonte.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.routers.horizonte.middlewares=horizonte-gzip
      - traefik.http.middlewares.horizonte-gzip.compress=true
      - traefik.http.services.horizonte.loadbalancer.server.port=8080

volumes:
  horizonte_datos:

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik}
